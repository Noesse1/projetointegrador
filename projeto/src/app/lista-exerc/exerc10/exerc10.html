<h2>Exercício 10 - Login Simulado</h2>

<div>
  <label>Usuário: </label>

  <input type="text" [(ngModel)]="usuario">
</div>

<div>
  <label>Senha: </label>
  
  <input type="password" [(ngModel)]="senha">
</div>

<button (click)="entrar()" [disabled]="usuario === '' || senha === ''">
  Entrar
</button>

<hr>

<p>{{ mensagemBoasVindas }}</p>
