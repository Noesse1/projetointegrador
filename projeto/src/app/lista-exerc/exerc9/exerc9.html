<h2>Exercício 9 - Controle de Estoque</h2>

<div>
  <label>Alterar Produto: </label>
  <input type="text" [(ngModel)]="nomeProduto">
</div>

<hr>


<h3>Produto: {{ nomeProduto }}</h3>
<p>Quantidade em estoque: {{ estoque }}</p>

<button (click)="diminuir()" [disabled]="estoque === 0"> - </button>
<button (click)="aumentar()"> + </button>
